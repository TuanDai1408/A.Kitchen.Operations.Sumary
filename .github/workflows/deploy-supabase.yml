name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'alqcojnxshfylheovdgw' }}
          API_TOKEN: ${{ secrets.API_TOKEN || 'TRANTUANDAISIBAFOOD' }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: |
          # Xóa khoảng trắng thừa nếu có
          TOKEN=$(echo "$SUPABASE_ACCESS_TOKEN" | xargs)
          
          if [ -z "$TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN chưa được cài đặt trong GitHub Secrets."
            echo "👉 Vui lòng vào GitHub Repo > Settings > Secrets and variables > Actions > Tạo Secret 'SUPABASE_ACCESS_TOKEN'."
            echo "👉 Lấy token tại: https://supabase.com/dashboard/account/tokens (Token phải bắt đầu bằng 'sbp_')"
            exit 1
          fi

          # Kiểm tra nếu người dùng vô tình dán anon key hoặc service_role key (JWT bắt đầu bằng eyJ...)
          if [[ "$TOKEN" == eyJ* ]]; then
            echo "::error::Phát hiện lỗi cấu hình: SUPABASE_ACCESS_TOKEN bạn nhập đang là JWT Key (bắt đầu bằng 'eyJ...'), thường là Anon Key hoặc Service Role Key."
            echo "::error::Supabase CLI bắt buộc phải dùng 'Personal Access Token' (bắt đầu bằng 'sbp_...'), không dùng Project API Key."
            echo "👉 HƯỚNG DẪN KHẮC PHỤC:"
            echo "1. Đăng nhập Supabase: https://supabase.com/dashboard/account/tokens"
            echo "2. Bấm 'Generate new token', đặt tên (ví dụ: github-deploy)"
            echo "3. Copy token vừa tạo (có dạng: sbp_xxxxxxxxxxxxxxxxxxxxxxxx)"
            echo "4. Vào GitHub Repo > Settings > Secrets and variables > Actions"
            echo "5. Cập nhật secret 'SUPABASE_ACCESS_TOKEN' với token 'sbp_...' vừa copy."
            exit 1
          fi

          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          echo "🚀 Đang triển khai Edge Function 'api' lên dự án Supabase: $PROJECT_ID"

          # Cài đặt secrets trên Supabase nếu có
          if [ -n "$SERVICE_ROLE_KEY" ]; then
            supabase secrets set API_TOKEN="$API_TOKEN" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" --project-ref "$PROJECT_ID" || true
          else
            supabase secrets set API_TOKEN="$API_TOKEN" --project-ref "$PROJECT_ID" || true
          fi

          # Deploy Edge Function
          supabase functions deploy api --no-verify-jwt --project-ref "$PROJECT_ID"
          echo "✅ Đã deploy thành công Edge Function 'api'!"
