name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'alqcojnxshfylheovdgw' }}
          API_TOKEN: ${{ secrets.API_TOKEN || 'TRANTUANDAISIBAFOOD' }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN chưa được cài đặt trong GitHub Secrets."
            echo "Vui lòng vào GitHub Repo > Settings > Secrets and variables > Actions > Thêm SUPABASE_ACCESS_TOKEN."
            echo "Xem hướng dẫn lấy token tại: https://supabase.com/dashboard/account/tokens"
            exit 0
          fi

          echo "🚀 Đang triển khai Edge Function 'api' lên dự án Supabase: $PROJECT_ID"

          # Cài đặt secrets trên Supabase nếu có
          if [ -n "$SERVICE_ROLE_KEY" ]; then
            supabase secrets set API_TOKEN="$API_TOKEN" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" --project-ref "$PROJECT_ID"
          else
            supabase secrets set API_TOKEN="$API_TOKEN" --project-ref "$PROJECT_ID"
          fi

          # Deploy Edge Function mà không cần bước supabase link
          supabase functions deploy api --no-verify-jwt --project-ref "$PROJECT_ID"
          echo "✅ Đã deploy thành công function 'api'!"
